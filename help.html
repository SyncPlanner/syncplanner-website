<title>SYNC.PLANNER — Guide d'utilisation</title>
<meta name="description" content="Guide complet de SYNC.PLANNER : radar des deadlines, suivi des tracks, relances éditeurs, livrables, revenus SACEM, Logic Pro et sauvegardes.">
<link rel="canonical" href="https://syncplanner.app/help">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F3EEE3;--bg2:#E9E4D9;--bg3:#E3DDD1;--bg4:#DDD6C8;
  --border:#D6CEBF;--border2:#BFB6A6;
  --text:#1F1C17;--text2:#3A352D;--text3:#5A544A;--text4:#8A8273;
  --purple:#1F1C17;--purple2:#1F1C17;--purple3:#3A352D;
  --blue:#1A5492;--green:#16683C;--orange:#A44A12;--red:#A0281C;--yellow:#8A5408;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;line-height:1.6;min-height:100vh}
a{color:var(--purple2);text-decoration:none}
a:hover{text-decoration:underline}
.container{max-width:900px;margin:0 auto;padding:0 24px}

/* TOPBAR */
.topbar{background:rgba(243,238,227,0.95);border-bottom:1px solid var(--border);padding:14px 0;position:sticky;top:0;z-index:100;backdrop-filter:blur(10px)}
.topbar-inner{display:flex;align-items:center;justify-content:space-between}
.logo{font-size:16px;font-weight:800;color:var(--text);display:flex;align-items:center;gap:8px}
.logo-dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(135deg,var(--purple2),var(--purple))}
.lang-switch{display:flex;gap:4px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:3px}
.lang-btn{padding:4px 12px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600;font-family:'Inter',sans-serif;transition:all 0.15s;color:var(--text3);background:transparent}
.lang-btn.active{background:var(--purple);color:#fff}

/* HERO */
.hero{padding:56px 0 32px;text-align:center}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(31,28,23,0.06);border:1px solid rgba(31,28,23,0.17);border-radius:100px;padding:4px 14px;font-size:11px;font-weight:700;color:var(--purple2);margin-bottom:20px;text-transform:uppercase;letter-spacing:0.08em}
.hero h1{font-size:36px;font-weight:800;color:var(--text);line-height:1.2;margin-bottom:12px}
.hero h1 .grad{color:#8A8273}
.hero p{font-size:15px;color:var(--text3);max-width:520px;margin:0 auto 28px}
.search-wrap{max-width:420px;margin:0 auto;position:relative}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none}
.search-input{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:11px 14px 11px 40px;color:var(--text);font-size:13px;font-family:'Inter',sans-serif;outline:none;transition:border-color 0.2s}
.search-input:focus{border-color:var(--purple)}
.search-input::placeholder{color:var(--text4)}

/* NAV PILLS */
.nav-pills{display:flex;flex-wrap:wrap;gap:6px;margin:28px 0 0;justify-content:center}
.nav-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:100px;border:1px solid var(--border);background:var(--bg2);color:var(--text3);font-size:12px;font-weight:600;cursor:pointer;transition:all 0.15s}
.nav-pill:hover{border-color:var(--purple);color:var(--purple2);background:rgba(31,28,23,0.04)}

/* SECTIONS */
.sections{padding:24px 0 60px;display:flex;flex-direction:column;gap:6px}
.section{border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:border-color 0.2s}
.section.open{border-color:var(--border2)}
.section-hdr{display:flex;align-items:center;gap:12px;padding:16px 20px;background:var(--bg3);cursor:pointer;transition:background 0.15s;user-select:none}
.section-hdr:hover{background:var(--bg4)}
.section-icon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.section-title-wrap{flex:1}
.section-title{font-size:14px;font-weight:700;color:var(--text)}
.section-sub{font-size:11px;color:var(--text4);margin-top:1px}
.section-chevron{font-size:11px;color:var(--text4);transition:transform 0.25s;flex-shrink:0}
.section.open .section-chevron{transform:rotate(180deg)}
.section-body{display:none;background:var(--bg2);border-top:1px solid var(--border)}
.section.open .section-body{display:block}

/* CONTENT */
.section-content{padding:20px}
.item-list{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
.item{display:flex;gap:10px;align-items:flex-start}
.item-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:8px}
.item-text{font-size:13px;color:var(--text2);line-height:1.65}
.item-text b{color:var(--text);font-weight:700}
.item-text code{background:var(--bg4);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-size:11px;color:var(--purple3);font-family:monospace}

/* DEMO */
.demo-wrap{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:16px;position:relative}
.demo-label{position:absolute;top:-1px;right:14px;background:linear-gradient(135deg,var(--purple),#3A352D);color:#fff;font-size:9px;font-weight:700;padding:2px 10px;border-radius:0 0 8px 8px;text-transform:uppercase;letter-spacing:0.08em}
.demo-hint{font-size:10px;color:var(--text4);text-align:center;margin-top:10px;font-style:italic}

/* BADGE STATUS */
.sbadge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:100px;font-size:10px;font-weight:700;cursor:pointer;transition:all 0.15s;user-select:none}

/* BTN */
.btn-demo{padding:6px 14px;border-radius:7px;border:1px solid var(--border);background:var(--bg3);color:var(--text3);cursor:pointer;font-size:11px;font-weight:600;font-family:'Inter',sans-serif;transition:all 0.15s}
.btn-demo:hover{border-color:var(--purple2);color:var(--purple2)}
.btn-primary{background:rgba(31,28,23,0.08);border-color:rgba(31,28,23,0.22);color:var(--purple2)}
.btn-primary:hover{background:rgba(31,28,23,0.14)}
.btn-green{background:rgba(22,104,60,0.1);border-color:rgba(22,104,60,0.3);color:#16683C}
.btn-red{background:rgba(160,40,28,0.1);border-color:rgba(160,40,28,0.3);color:#A0281C}

/* TRACK ROW */
.track-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;margin-bottom:5px;transition:border-color 0.15s}
.track-row:hover{border-color:var(--border2)}
.track-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:background 0.3s}
.track-title{font-size:12px;font-weight:700;color:var(--text);flex:1}
.track-meta{font-size:10px;color:var(--text4)}

/* KANBAN */
.kb-board{display:grid;gap:6px;margin:8px 0}
.kb-col{background:var(--bg3);border:1px solid var(--border);border-radius:9px;overflow:hidden;min-height:80px}
.kb-col-hdr{padding:9px 11px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.kb-col-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.07em}
.kb-col-count{font-size:11px;font-weight:900;padding:1px 7px;border-radius:100px}
.kb-col-body{padding:6px;min-height:50px;transition:background 0.2s}
.kb-col-body.drag-over{background:rgba(31,28,23,0.04)}
.kb-card{background:var(--bg4);border:1px solid var(--border);border-radius:7px;padding:9px;margin-bottom:5px;cursor:grab;transition:all 0.15s;user-select:none}
.kb-card:hover{border-color:var(--border2);transform:translateY(-1px);box-shadow:0 4px 12px rgba(60,45,25,0.15)}
.kb-card:active{cursor:grabbing;transform:translateY(0)}
.kb-card.dragging{opacity:0.4}
.kb-card-title{font-size:11px;font-weight:700;color:var(--text);margin-bottom:3px}
.kb-card-sub{font-size:9px;color:var(--text4)}
.kb-tags{display:flex;gap:3px;flex-wrap:wrap;margin-top:5px}
.kb-tag{font-size:9px;background:var(--bg);border:1px solid var(--border);padding:1px 5px;border-radius:3px;color:var(--text3)}

/* PROGRESS */
.prog-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:6px}
.prog-fill{height:100%;border-radius:2px;transition:width 0.5s ease}

/* STAT GRID */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.stat-card{background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:12px;text-align:center}
.stat-val{font-size:22px;font-weight:900;line-height:1.1}
.stat-lbl{font-size:9px;color:var(--text4);margin-top:2px;font-weight:600;text-transform:uppercase;letter-spacing:0.04em}

/* CHART */
.chart-wrap{display:flex;align-items:flex-end;gap:4px;height:70px;margin:12px 0;padding-bottom:2px}
.chart-bar-demo{flex:1;border-radius:3px 3px 0 0;min-width:0;transition:height 0.4s ease,opacity 0.3s}
.chart-legend{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.chart-leg-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--text3);cursor:pointer;padding:3px 8px;border-radius:100px;border:1px solid transparent;transition:all 0.15s}
.chart-leg-item:hover,.chart-leg-item.active{border-color:currentColor}
.chart-leg-dot{width:8px;height:8px;border-radius:2px}

/* COLLAB */
.collab-row{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg3);border:1px solid var(--border);border-radius:9px;margin-bottom:6px;cursor:pointer;transition:border-color 0.15s}
.collab-row:hover{border-color:var(--border2)}
.collab-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex-shrink:0}
.collab-tracks{display:none;padding:8px 10px;background:var(--bg4);border:1px solid var(--border);border-radius:7px;margin-top:-3px;margin-bottom:6px}

/* MOOD */
.mood-tags{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}
.mood-tag{padding:3px 10px;border-radius:5px;font-size:11px;font-weight:600;background:rgba(31,28,23,0.06);border:1px solid rgba(31,28,23,0.11);color:var(--purple2);cursor:pointer;transition:all 0.15s}
.mood-tag.selected,.mood-tag:hover{background:rgba(31,28,23,0.14);border-color:rgba(31,28,23,0.28)}

/* ALERT */
.alert-row{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;margin-bottom:5px;border:1px solid}
.alert-row.urgent{background:rgba(160,40,28,0.06);border-color:rgba(160,40,28,0.2)}
.alert-row.warning{background:rgba(138,84,8,0.06);border-color:rgba(138,84,8,0.2)}
.alert-row.relance{background:rgba(164,74,18,0.06);border-color:rgba(164,74,18,0.2)}
.jx-badge{font-size:9px;font-weight:800;padding:2px 7px;border-radius:100px}

/* CALENDAR */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-day-hdr{font-size:9px;color:var(--text4);font-weight:700;padding:5px 2px}
.cal-day{padding:5px 3px;font-size:10px;border-radius:5px;cursor:pointer;transition:background 0.15s;position:relative}
.cal-day:hover{background:var(--bg3)}
.cal-day.has-deadline{font-weight:800}
.cal-dot{width:4px;height:4px;border-radius:50%;margin:1px auto 0}

/* PUBLISHER */
.pub-card{background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:12px;margin-bottom:6px}
.pub-stat{text-align:center;flex:1}
.pub-stat-val{font-size:15px;font-weight:900}
.pub-stat-lbl{font-size:9px;color:var(--text4);font-weight:600;text-transform:uppercase}
.pub-rate-bar{height:6px;background:var(--border);border-radius:3px;margin-top:10px;overflow:hidden}

/* AI PROMPTS */
.ai-prompt{display:flex;align-items:center;gap:6px;padding:7px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;font-size:11px;font-weight:600;color:var(--text2);cursor:pointer;transition:all 0.15s;margin-bottom:5px}
.ai-prompt:hover{border-color:var(--purple);color:var(--purple2);background:rgba(31,28,23,0.04)}
.ai-response{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px;font-size:12px;color:var(--text2);line-height:1.6;margin-top:8px;display:none}
.ai-response.visible{display:block}

/* GOALS */
.goal-row{margin-bottom:12px}
.goal-hdr{display:flex;justify-content:space-between;margin-bottom:5px}
.goal-label{font-size:12px;font-weight:700;color:var(--text)}
.goal-val{font-size:12px;font-weight:800}
.goal-proj{font-size:10px;color:var(--text4);margin-top:3px}

/* HIGHLIGHT SEARCH */
mark{background:rgba(138,84,8,0.3);color:var(--text);border-radius:2px;padding:0 2px}

/* FOOTER */
footer{border-top:1px solid var(--border);padding:32px 0;text-align:center}
footer p{font-size:12px;color:var(--text4)}

@media(max-width:640px){
  .hero h1{font-size:26px}
  .stat-grid{grid-template-columns:repeat(2,1fr)}
  .kb-board{grid-template-columns:repeat(2,1fr)}
}
.section{scroll-margin-top:76px}
  body{-webkit-font-smoothing:antialiased}
</style>

// anciens liens (#kanban, #calendar…) → nouvelles sections
const ALIAS = {kanban:'tracks', alerts:'sending', goals:'stats', collabs:'publishers', calendar:'dashboard', sacem:'revenue', logicpro:'logic'};

function renderSections() {
  const pillsEl = document.getElementById('pills'), sectionsEl = document.getElementById('sections');
  pillsEl.innerHTML = ''; sectionsEl.innerHTML = '';
  SECTIONS.forEach(s => {
    const pill = document.createElement('a');
    pill.className = 'nav-pill'; pill.href = '#' + s.id;
    pill.innerHTML = `<span style="color:${s.color}">${s.icon}</span><span>${s.title[LANG]}</span>`;
    pill.onclick = e => { e.preventDefault(); openSection(s.id); history.replaceState(null, '', '#' + s.id); };
    pillsEl.appendChild(pill);
    const sec = document.createElement('div');
    sec.className = 'section'; sec.id = 'section-' + s.id;
    sec.innerHTML = `
      <div class="section-hdr" onclick="toggleSection('${s.id}')">
        <div class="section-icon" style="background:${s.bg}">${s.icon}</div>
        <div class="section-title-wrap">
          <div class="section-title">${s.title[LANG]}</div>
          <div class="section-sub">${s.sub[LANG]}</div>
        </div>
        <span class="section-chevron">▼</span>
      </div>
      <div class="section-body"><div class="section-content"><div class="item-list">
        ${s.items.map(item => `<div class="item"><div class="item-dot" style="background:${s.color}"></div><div class="item-text">${item[LANG]}</div></div>`).join('')}
      </div></div></div>`;
    sectionsEl.appendChild(sec);
  });
  const empty = document.createElement('p'); empty.id = 'no-result'; empty.style.cssText = 'display:none;text-align:center;color:var(--text4,#5A544A);font-size:13px;margin:24px 0';
  empty.textContent = T.empty[LANG]; sectionsEl.appendChild(empty);
  const demo = document.createElement('p'); demo.style.cssText = 'text-align:center;margin:28px 0 8px';
  demo.innerHTML = `<a href="/demo.html?lang=${LANG}" style="color:#1F1C17;font-size:13px;text-decoration:none">${T.demo[LANG]}</a>`;
  sectionsEl.appendChild(demo);
}
function toggleSection(id) { document.getElementById('section-' + id).classList.toggle('open'); }
function openSection(id) {
  id = ALIAS[id] || id; const el = document.getElementById('section-' + id); if(!el) return;
  el.classList.add('open'); setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50);
}
function setLang(lang) {
  LANG = lang === 'en' ? 'en' : 'fr';
  document.documentElement.lang = LANG;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(LANG === 'fr' ? '.lang-btn:first-child' : '.lang-btn:last-child').classList.add('active');
  document.getElementById('h-badge').textContent = T.badge[LANG];
  document.getElementById('h-title').textContent = T.title[LANG];
  document.getElementById('h-sub').textContent = T.sub[LANG];
  document.title = LANG === 'fr' ? "SYNC.PLANNER — Guide d'utilisation" : 'SYNC.PLANNER — User Guide';
  const searchEl = document.getElementById('search'); searchEl.placeholder = T.search[LANG];
  const openIds = Array.from(document.querySelectorAll('.section.open')).map(el => el.id.replace('section-', ''));
  renderSections();
  openIds.forEach(id => document.getElementById('section-' + id)?.classList.add('open'));
  if (searchEl.value) doSearch(searchEl.value);
  try { const u = new URL(location.href); u.searchParams.set('lang', LANG); history.replaceState(null, '', u); } catch(e) {}
}
function doSearch(q) {
  const s = q.toLowerCase().trim(); let n = 0;
  document.querySelectorAll('.section').forEach(sec => {
    if(!s) { sec.style.display = ''; n++; return; }
    const match = sec.textContent.toLowerCase().includes(s);
    sec.style.display = match ? '' : 'none'; if(match) { n++; sec.classList.add('open'); }
  });
  const e = document.getElementById('no-result'); if(e) e.style.display = n ? 'none' : 'block';
}
// Init : ?lang=en (lien depuis l'appli en anglais), sinon langue du navigateur
(function() {
  let l = 'fr';
  try { const p = new URLSearchParams(location.search).get('lang'); if(p) l = p; else if(!/^fr/i.test(navigator.language || 'fr')) l = 'en'; } catch(e) {}
  if(l === 'en') setLang('en'); else renderSections();
  if(location.hash) setTimeout(() => openSection(location.hash.slice(1)), 150);
})();
</script>
